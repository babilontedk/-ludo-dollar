name: "ludo-dollar-mobile"
description: "Ludo Dollar - Complete Flutter Mobile Application"
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.3.0
  
  # HTTP & API
  dio: ^5.3.1
  socket_io_client: ^2.0.0
  
  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  
  # UI & UX
  flutter_screenutil: ^5.9.0
  smooth_page_indicator: ^1.0.1
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.6.0
  
  # Navigation
  go_router: ^10.0.0
  
  # Forms & Validation
  formz: ^0.6.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.0.0
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^5.0.0
  logger: ^2.0.0
  
  # Payment
  flutter_paystack: ^1.0.0
  
  # Animations
  flutter_animate: ^4.1.0
  
  # Social
  share_plus: ^7.0.0
  
  # Local Notifications
  flutter_local_notifications: ^14.0.0
  
  # App version
  package_info_plus: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/sounds/
    - assets/animations/
    - assets/icons/
    - .env
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
